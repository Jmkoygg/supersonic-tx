name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: "3.1.11"
  ANCHOR_VERSION: "0.31.1"

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check (host crates)
        run: cargo fmt --all -- --check

      - name: Clippy (host crates, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Build on-chain program (produces .so for the invariant tests)
        run: anchor build

      - name: Build Pinocchio bench program (produces the .so for pinocchio_invariants)
        run: cd bench/pinocchio-router && cargo build-sbf

      - name: Test workspace (unit/integration/property/bench/pinocchio-invariant tests)
        run: cargo test --workspace

      - name: Reproduce the adversarial proof numbers
        run: cargo run -p supersonic-harness --release -- --n 2000 --seed 1
