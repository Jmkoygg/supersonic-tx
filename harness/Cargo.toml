[package]
name = "supersonic-harness"
version = "0.1.0"
edition = "2021"
description = "Adversarial proof harness for supersonic-tx: runs real classifiers against generated bundles and measures the attacker's advantage over the 1/K baseline."
license = "MIT"
default-run = "supersonic-harness"

[dependencies]
supersonic-sdk = { path = "../sdk" }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Raw JSON-RPC for collect-mainnet-profiles (getBlock transactionDetails=accounts
# isn't exposed by every typed solana-client version). Pinned to 0.11 to match the
# version already resolved transitively via solana-client, avoiding a second TLS
# stack in the dependency graph.
reqwest = { version = "0.11", features = ["blocking", "json"] }

[[bin]]
name = "supersonic-harness"
path = "src/main.rs"

[[bin]]
name = "collect-devnet-history"
path = "src/bin/collect_devnet_history.rs"

[[bin]]
name = "collect-mainnet-profiles"
path = "src/bin/collect_mainnet_profiles.rs"

[dev-dependencies]
mollusk-svm = "0.14"
mollusk-svm-bencher = "0.14"
# Mollusk 0.14 pulls a newer generation of these crates than our SDK/CLI (solana-sdk
# 2.2) does; pinned here to the versions Mollusk actually expects, since Instruction/
# Pubkey aren't interchangeable across the two generations (see
# tests/mollusk_cu_bench.rs). Kept as a harness (host-side) dev-dependency, not a
# dependency of the on-chain program crate: Mollusk's own dependency graph needs a
# newer Cargo edition than the Rust toolchain bundled with the pinned Solana CLI
# version supports, and `cargo build-sbf` builds the program crate's own graph — so
# keeping Mollusk out of programs/supersonic-tx/Cargo.toml avoids that conflict
# entirely rather than fighting toolchain versions.
solana-pubkey = "4.2"
solana-instruction = "3.4"
solana-account = "4.3"
solana-sdk-ids = "3.1"
