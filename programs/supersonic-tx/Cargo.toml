[package]
name = "supersonic-tx"
version = "0.1.0"
description = "On-chain atomic router for intent-ambiguous transfer bundles (Solana)."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "supersonic_tx"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
mollusk-svm = "0.14"
mollusk-svm-bencher = "0.14"
supersonic-sdk = { path = "../../sdk" }
# Mollusk 0.14 pulls a newer generation of these crates than our SDK/CLI (solana-sdk
# 2.2) does; pinned here to the versions Mollusk actually expects, since Instruction/
# Pubkey aren't interchangeable across the two generations (see mollusk_cu_bench.rs).
solana-pubkey = "4.2"
solana-instruction = "3.4"
solana-account = "4.3"
solana-sdk-ids = "3.1"

