[package]
name = "supersonic-tx"
version = "0.1.0"
description = "On-chain atomic router for intent-ambiguous transfer bundles (Solana)."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "supersonic_tx"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
supersonic-sdk = { path = "../../sdk" }

# anchor-lang's macros (#[program], #[derive(Accounts)]) emit cfg checks for
# build-time flags (custom-heap/custom-panic/anchor-debug feature gates, the
# solana target_os) that this crate never declares itself. Without this,
# clippy's unexpected_cfgs lint flags macro-generated code we don't control.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
    'cfg(target_os, values("solana"))',
]

