[workspace]
members = [
    "programs/*",
    "sdk",
    "cli",
    "harness",
]
resolver = "2"

[workspace.dependencies]
solana-sdk = "2.2"
solana-client = "2.2"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
